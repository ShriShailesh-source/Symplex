[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symplex"
version = "0.1.0"
description = "Phase 1 foundation for the SYMPLEX neuro-symbolic planning project"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3", "python-dotenv>=1.0,<2"]

[project.scripts]
symplex = "symplex.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
